services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: dsm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: dsm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /scripts/create-topics.sh | bash"]
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: dsm-redpanda-console
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092

  postgres:
    image: postgres:16-alpine
    container_name: dsm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dsm_metadata
      POSTGRES_USER: dsm_user
      POSTGRES_PASSWORD: dsm_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsm_user -d dsm_metadata"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: dsm-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dsm_lms
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.23-community
    container_name: dsm-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/dsm_neo4j_pass
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/init:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p dsm_neo4j_pass 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ingestion-gateway:
    build:
      context: ..
      dockerfile: services/ingestion-gateway/Dockerfile
    container_name: dsm-ingestion-gateway
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      DSM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DSM_PSEUDONYM_SALT: ${DSM_PSEUDONYM_SALT:-change-me-in-production-secret-salt}
      DSM_DEFAULT_RUN_ID: ${DSM_DEFAULT_RUN_ID:-run_dev_001}
      DSM_CONFIG_DIR: /app/config
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  replayer:
    build:
      context: ..
      dockerfile: services/replayer/Dockerfile
    container_name: dsm-replayer
    profiles: ["replay"]
    depends_on:
      ingestion-gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DSM_GATEWAY_URL: http://ingestion-gateway:8000
      DSM_POSTGRES_DSN: postgresql://dsm_user:dsm_pass@postgres:5432/dsm_metadata
      DSM_CONFIG_DIR: /app/config
    volumes:
      - ../data:/app/data:ro
      - ../config:/app/config:ro

  preprocessor:
    build:
      context: ..
      dockerfile: services/preprocessor/Dockerfile
    container_name: dsm-preprocessor
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8004:8004"
    environment:
      DSM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DSM_CONFIG_DIR: /app/config
      DSM_PREPROCESSOR_STATE_DIR: /var/lib/dsm-preprocessor/state
      DSM_PREPROCESSOR_CONSUMER_GROUP: dsm-preprocessor-v1
      DSM_PREPROCESSOR_AUTO_OFFSET_RESET: earliest
      DSM_PREPROCESSOR_USE_CHANGELOG_TOPICS: "false"
      DSM_PREPROCESSOR_METRICS_PORT: 8004
    volumes:
      - ../config:/app/config:ro
      - preprocessor_state:/var/lib/dsm-preprocessor/state
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  clustering:
    build:
      context: ..
      dockerfile: services/clustering/Dockerfile
    container_name: dsm-clustering
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    ports:
      - "8005:8005"
    environment:
      DSM_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DSM_MONGO_URI: mongodb://mongodb:27017
      DSM_MONGO_DB: dsm_lms
      DSM_CONFIG_DIR: /app/config
      DSM_CLUSTERING_CONSUMER_GROUP: dsm-clustering-v1
      DSM_CLUSTERING_AUTO_OFFSET_RESET: earliest
      DSM_CLUSTERING_METRICS_PORT: 8005
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  kafka_data:
  postgres_data:
  mongo_data:
  neo4j_data:
  preprocessor_state:
