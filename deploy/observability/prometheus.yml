global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ingestion-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ingestion-gateway:8000"]

  - job_name: "preprocessor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["preprocessor:8004"]

  - job_name: "clustering"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["clustering:8005"]

  - job_name: "process-mining"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["process-mining:8006"]

  - job_name: "query-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["query-api:8007"]
