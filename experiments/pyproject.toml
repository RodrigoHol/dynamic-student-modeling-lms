[project]
name = "dsm-experiments"
version = "0.1.0"
description = "Módulo C9: Validación experimental, línea base batch y reporte cuantitativo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[kafka,mongo,neo4j,postgres]",
    "dsm-core[clustering,process-mining]",
    "scikit-learn>=1.5.0",
]

[project.scripts]
dsm-experiments = "dsm_experiments.cli:main"

[tool.uv.sources]
dsm-common = { workspace = true }
dsm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_experiments"]
