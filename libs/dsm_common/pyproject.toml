[project]
name = "dsm-common"
version = "0.1.0"
description = "Infraestructura compartida transversal para Dynamic Student Modeling LMS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
kafka = ["aiokafka>=0.11.0"]
mongo = ["pymongo>=4.10.0"]
postgres = ["asyncpg>=0.29.0"]
observability = ["prometheus-client>=0.20.0"]
all = [
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "prometheus-client>=0.20.0",
    "pymongo>=4.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_common"]
