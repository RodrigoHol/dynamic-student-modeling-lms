[project]
name = "dsm-core"
version = "0.1.0"
description = "Dominio analítico puro (preprocesamiento, ventanas, features, clustering y EPM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common",
]

[project.optional-dependencies]
clustering = ["river>=0.21.0"]
process-mining = ["pm4py>=2.7.11"]

[tool.uv.sources]
dsm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_core"]
