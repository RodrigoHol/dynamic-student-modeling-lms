[project]
name = "dynamic-student-modeling-lms"
version = "0.1.0"
description = "Plataforma Kappa para modelado dinámico e interpretable de estudiantes en LMS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "libs/dsm_common",
    "libs/dsm_core",
    "services/ingestion-gateway",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["dsm_common", "dsm_core", "dsm_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "libs/dsm_common/tests",
    "libs/dsm_core/tests",
    "services/ingestion-gateway/tests",
]
