[project]
name = "dsm-clustering"
version = "0.1.0"
description = "Servicio C5: Clustering evolutivo incremental sobre River hacia MongoDB y Kafka"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[kafka,mongo,observability]",
    "dsm-core[clustering]",
]

[project.scripts]
dsm-clustering = "dsm_clustering.main:main"

[tool.uv.sources]
dsm-common = { workspace = true }
dsm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_clustering"]
