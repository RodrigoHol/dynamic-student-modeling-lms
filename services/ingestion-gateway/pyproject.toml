[project]
name = "dsm-ingestion-gateway"
version = "0.1.0"
description = "Servicio C2: Gateway asíncrono para ingesta de flujos de eventos educativos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[kafka,observability]",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
dsm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_gateway"]
