[project]
name = "dsm-preprocessor"
version = "0.1.0"
description = "Servicio C4: Preprocessor continuo con Quix Streams, HLE y ventanas múltiples"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[observability]",
    "dsm-core",
    "quixstreams>=3.0.0",
]

[project.scripts]
dsm-preprocessor = "dsm_preprocessor.main:main"

[tool.uv.sources]
dsm-common = { workspace = true }
dsm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_preprocessor"]
