[project]
name = "dsm-process-mining"
version = "0.1.0"
description = "Servicio C6: Minería de procesos educativos (DFG aditivo sobre PM4Py) hacia Neo4j"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[kafka,neo4j,observability]",
    "dsm-core[process-mining]",
]

[project.scripts]
dsm-process-mining = "dsm_process_mining.main:main"

[tool.uv.sources]
dsm-common = { workspace = true }
dsm-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_process_mining"]
