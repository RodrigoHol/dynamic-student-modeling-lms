[project]
name = "dsm-replayer"
version = "0.1.0"
description = "Servicio C3: Replayer de históricos reales de Moodle y generador sintético"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dsm-common[postgres]",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.scripts]
dsm-replayer = "dsm_replayer.cli:main"

[tool.uv.sources]
dsm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm_replayer"]
